services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: browser-use-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
      - ./backend/skills:/app/skills
      - ./backend/profiles:/app/profiles
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/app.db
      - SKILLS_PATH=/app/skills
      - BROWSER_HEADLESS=true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: browser-use-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend
